{% extends "base.html" %}

{% block title %}Admin - Los Bala Perdia 🎡{% endblock %}

{% block body %}
  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered header-title">
        🏮 Admin – Los Bala Perdia 🔴
      </h1>

      <div id="offline-notice" class="notification is-danger is-hidden" role="alert">
        Sin conexión con la caseta
      </div>

      <!-- Formulario de PIN: lo único que se ve hasta entrar como administrador -->
      <div id="login-section" class="columns is-centered is-hidden">
        <div class="column is-one-third">
          <form id="pin-form" class="box" autocomplete="off">
            <div class="field">
              <label class="label" for="pin-input">PIN de administrador</label>
              <div class="control">
                <input id="pin-input" class="input" type="password" inputmode="numeric" autocomplete="off" required>
              </div>
              <p id="pin-error" class="help is-danger" role="alert"></p>
            </div>
            <button id="pin-btn" class="button is-link is-fullwidth" type="submit">Entrar</button>
          </form>
        </div>
      </div>

      <div id="admin-section" class="is-hidden">
        <div id="audio-notice" class="notification is-warning is-hidden" role="status"></div>
        <div class="columns">
          <div class="column is-half">
            <div id="categories" class="buttons mb-4"></div>
            <div class="field">
              <label class="label" for="search">Buscar canción</label>
              <div class="control">
                <input id="search" class="input" type="search" placeholder="Filtrar lista..." autocomplete="off">
              </div>
            </div>
            <nav class="pagination is-flex is-align-items-center mb-3" aria-label="Paginación canciones">
              <button id="prev-page" class="button" type="button" disabled>Anterior</button>
              <button id="next-page" class="button ml-2" type="button" disabled>Siguiente</button>
              <span id="page-info" class="ml-4"></span>
            </nav>
            <div id="song-list" class="box">
              <table class="table is-fullwidth is-striped">
                <thead>
                  <tr><th>Canción</th><th></th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="column is-half">
            <h2 class="subtitle header-title">🎶 Cola de reproducción</h2>
            <button id="skip-btn" class="button is-warning mb-3" type="button">Saltar canción</button>
            <div id="queue" class="box"></div>
            <!-- Resumen de la cola -->
            <p id="queue-info" class="has-text-centered mt-2"></p>
          </div>
        </div>
        <p class="has-text-right">
          <a href="/" class="button is-light">Volver a Usuario</a>
        </p>
      </div>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='userlogic.js') }}"></script>
  <script src="{{ url_for('static', filename='adminlogic.js') }}"></script>
  <script src="{{ url_for('static', filename='library.js') }}"></script>
  <script src="{{ url_for('static', filename='admin.js') }}"></script>
{% endblock %}
